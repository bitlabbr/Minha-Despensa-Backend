name: Backend CI Check

on:
  push:
    branches: [ "main", "dev", "hotfix", "epic/**" ]
  pull_request:
    branches: [ "main", "dev", "epic/**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit & WebMvc Tests
        run: ./gradlew test --info

      - name: Package Executable Fat JAR
        run: ./gradlew bootJar -x test

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 7

      - name: Publish JUnit Test Report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'

  docker-check:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: .

      - name: Prepare JAR for Dockerfile
        run: |
          JAR_FILE=$(ls *.jar | head -n 1)
          cp "$JAR_FILE" app.jar

      - name: Build Docker Image
        run: docker build -t minha-despensa:ci-check .
