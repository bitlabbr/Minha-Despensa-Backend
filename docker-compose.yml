services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minhadespensa-backend
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=${DB_URL:-jdbc:postgresql://postgres:5432/despensa}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - tailscale_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.despensa.rule=Host(`despensa.domus.arpa`)"
      - "traefik.http.routers.despensa.entrypoints=web"
      - "traefik.http.services.despensa.loadbalancer.server.port=8080"

networks:
  tailscale_proxy:
    external: true
