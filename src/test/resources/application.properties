spring.application.name=minha-despensa-test

spring.datasource.url=jdbc:h2:mem:despensa_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=false

app.jwt.secret=test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-testing-purposes
app.jwt.access-expiration-ms=3600000
app.jwt.refresh-expiration-ms=2592000000

logging.level.root=INFO
logging.level.com.bitlabbr.minhadespensa=DEBUG
logging.level.com.bitlabbr.minhadespensa.http.AccessLog=INFO
