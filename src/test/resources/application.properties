spring.application.name=minha-despensa-test

spring.datasource.url=jdbc:h2:mem:despensa_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.root=INFO
logging.level.com.bitlabbr.minhadespensa=DEBUG
logging.level.com.bitlabbr.minhadespensa.http.AccessLog=INFO
