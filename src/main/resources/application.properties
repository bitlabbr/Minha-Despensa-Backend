server.port=${SERVER_PORT:8080}
spring.application.name=minha-despensa

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/despensa}
spring.datasource.username=${DB_USER:despensa_user}
spring.datasource.password=${DB_PASSWORD:despensa_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Security
app.jwt.secret=${JWT_SECRET:minha-despensa-super-secret-jwt-key-minimum-256-bits-length-for-hmac-sha256}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# ------------------------------------------------------------------------------
# Logging Strategy & Observability
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.bitlabbr.minhadespensa=DEBUG
logging.level.com.bitlabbr.minhadespensa.http.AccessLog=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %highlight(%-5level) [%cyan(%thread)] %magenta(%logger{36}) : %msg%n
