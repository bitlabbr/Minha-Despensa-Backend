server.port=8080
spring.application.name=minha-despensa

spring.datasource.url=jdbc:postgresql://100.98.199.97:5432/despensa
spring.datasource.username=despensa_user
spring.datasource.password=despensa_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ------------------------------------------------------------------------------
# Logging Strategy & Observability
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.bitlabbr.minhadespensa=DEBUG
logging.level.com.bitlabbr.minhadespensa.http.AccessLog=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %highlight(%-5level) [%cyan(%thread)] %magenta(%logger{36}) : %msg%n